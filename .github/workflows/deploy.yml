name: Build and Deploy

on:
  push:
    branches: [main, dev]

jobs:
  # Run the JUnit suite against a real MySQL 8 service. This guards both
  # branches: dev pushes test-only, main pushes test-then-deploy. The deploy
  # job is gated on test success so a red suite stops a release before the
  # Docker image is even built.
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: my_journey
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL failed to become healthy"; exit 1

      - name: Run tests
        env:
          # On a fresh CI MySQL there is no schema yet, so V1 must actually
          # execute (the production default baselines V1 to fit existing
          # ddl-auto-created prod DBs). Forcing baseline-on-migrate=false
          # here lets Flyway create the schema from scratch.
          SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/my_journey?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ""
        run: ./mvnw test --no-transfer-progress -B

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write      # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: ghcr.io/spring0210/my-journey:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u spring0210 --password-stdin
            cd /opt/my-journey
            curl -fsSL https://raw.githubusercontent.com/Spring0210/My-Journey/main/docker-compose.yml -o docker-compose.yml
            docker compose pull
            docker compose up -d --remove-orphans
            # Post-deploy health gate. `docker compose up -d` only confirms the
            # container started, not that Spring Boot booted — Flyway crashes
            # and Hibernate validate failures pass through it silently. Poll
            # /actuator/health for up to ~60s and fail the workflow if the app
            # never comes up healthy, so a broken deploy stops being green.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null; then
                echo "App healthy after attempt ${i}"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            echo "App failed to become healthy within ~60s — dumping logs and failing the deploy"
            docker compose logs --tail=200 app
            exit 1
