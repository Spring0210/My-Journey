# Test-only properties for `./mvnw test`. Mirrors the prod-shaped
# application.properties (which is gitignored because it carries secrets)
# but ships safe stub values so the Spring context can start in CI without
# any external configuration.
#
# Production deploys use src/main/resources/application-docker.properties
# (loaded via SPRING_PROFILES_ACTIVE=docker); this file never affects them.

spring.application.name=my-journey-test

# JWT — fixed test secret. Long enough to satisfy HS256 minimum (32 bytes).
jwt.secret=${JWT_SECRET:test-secret-key-do-not-use-in-production-12345}

# Datasource — CI overrides via SPRING_DATASOURCE_URL env var. Locally,
# tests share the developer's dev MySQL since @Transactional rolls back.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/my_journey?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway — CI sets SPRING_FLYWAY_BASELINE_ON_MIGRATE=false to actually run
# V1 against a fresh DB. Locally, the dev DB is already baselined so the
# default is fine.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Cloudinary — stubbed. No test exercises the upload path; the bean only
# needs autowire to succeed.
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
cloudinary.secure=true

# Resend — stubbed for the same reason.
resend.api-key=test-resend-key
resend.from=test@example.invalid

# Anthropic — stub. The AnthropicChatClient is mocked in every test that
# would otherwise hit the network, so this value never reaches the wire.
anthropic.api-key=sk-ant-test-stub

# Google OAuth2 — stubbed. Login flow isn't exercised by the suite.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

server.forward-headers-strategy=framework
sentry.dsn=

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
