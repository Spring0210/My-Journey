# Database — connects to the mysql service defined in docker-compose.yml
spring.datasource.url=jdbc:mysql://mysql:3306/my_journey?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

# JWT
jwt.secret=${JWT_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.secure=true

# Resend Email
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM:noreply@myjourneycloud.com}

# Anthropic AI
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Trust the X-Forwarded-Proto header from Nginx so OAuth2 redirect URIs use https
server.forward-headers-strategy=framework

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile