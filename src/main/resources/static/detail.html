<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal Entry - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/image-utils.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/detail.js"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <button id="backBtn" class="btn btn--ghost btn--sm">← Back</button>
      </div>
      <div class="header-right">
        <span id="saveStatus" class="save-status"></span>
        <button id="saveBtn" class="btn btn--primary btn--sm">Create Entry</button>
        <!-- ⋯ overflow menu — contains secondary/destructive actions -->
        <div class="entry-menu-wrap" id="entryMenuWrap" hidden>
          <button class="entry-menu-trigger" id="entryMenuTrigger" title="More options">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="5"  cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
            </svg>
          </button>
          <div class="entry-menu-dropdown" id="entryMenuDropdown" hidden>
            <button class="entry-menu-item" id="exportBtn">Export PDF</button>
            <button class="entry-menu-item entry-menu-item--danger" id="deleteBtn">Delete Entry</button>
          </div>
        </div>
      </div>
    </header>

    <div class="content">

      <!-- Writing area -->
      <div class="entry-editor">
        <input id="title" type="text" class="title-input" placeholder="Untitled" autocomplete="off" />
        <div class="entry-meta-bar">
          <input id="entryDate" type="date" class="date-input" />
          <span id="entryDateDisplay" class="date-display"></span>
        </div>
        <textarea id="content" class="content-input" placeholder="Write your thoughts and experiences here..."></textarea>
      </div>

      <!-- Photos section — below writing area, full width -->
      <section class="card photos-section">
        <div class="photos-header">
          <span class="photos-title">Photos</span>
          <span class="image-count" id="imageCount"></span>
        </div>

        <!-- Hidden file input, triggered by the + cell in JS -->
        <input id="imageInput" type="file" accept="image/*" multiple class="file-input" />

        <!-- Unified grid: existing photos + pending previews + "+" cell -->
        <div id="photoGrid" class="photo-grid"></div>
      </section>

    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
</body>
</html>
