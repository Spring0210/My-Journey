<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Journal Entry - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/image-utils.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/detail.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="/journals.html" class="sidebar-brand">
        <div class="logo">J</div>
        Journey
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <a href="/dashboard.html" class="nav-item">Dashboard</a>
        <a href="/journals.html" class="nav-item">My Journals</a>
        <a href="/calendar.html" class="nav-item">Calendar View</a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"></div>
        <div class="user-details">
          <h4></h4>
          <p></p>
        </div>
      </div>
      <div class="sidebar-footer-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">Dark</button>
        <button class="signout-btn">Sign Out</button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <h1 class="header-title" id="pageTitle">New Entry</h1>
      </div>
      <div class="header-right">
        <span id="saveStatus" class="save-status"></span>
        <button id="deleteBtn" class="btn btn--delete">Delete</button>
        <button id="saveBtn" class="btn btn--primary">Create Entry</button>
        <button id="backBtn" class="btn btn--ghost">Back</button>
      </div>
    </header>

    <div class="content">

      <!-- Document-style writing area -->
      <div class="entry-editor">
        <input id="title" type="text" class="title-input" placeholder="Untitled" autocomplete="off" />
        <div class="entry-meta-bar">
          <input id="entryDate" type="date" class="date-input" />
          <span id="entryDateDisplay" class="date-display"></span>
        </div>
        <textarea id="content" class="content-input" placeholder="Write your thoughts and experiences here..."></textarea>
      </div>

      <!-- Photos section -->
      <section class="card images-card" id="imagesSection">
        <div class="images-header">
          <span class="images-title">Photos</span>
          <span class="image-count" id="imageCount">0 photos</span>
        </div>

        <!-- Existing photo grid -->
        <div id="imageBox" class="image-gallery"></div>

        <!-- Upload zone -->
        <div class="upload-zone">
          <input id="imageInput" type="file" accept="image/*" multiple class="file-input" />
          <label for="imageInput" class="upload-label">
            <div class="upload-plus">+</div>
            <span>Add Photos</span>
            <small>Click to choose, or drag and drop</small>
          </label>
        </div>

        <!-- Preview selected files -->
        <div id="previewBox" class="image-preview"></div>

        <!-- Confirm upload button, shown only when files are selected -->
        <button id="addImagesBtn" class="btn btn--primary upload-confirm-btn" hidden>
          Upload Selected Photos
        </button>
      </section>

    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
</body>
</html>
