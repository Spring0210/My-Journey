<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Journal Entry Detail - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/image-utils.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/detail.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="/journals.html" class="sidebar-brand">
        <div class="logo">J</div>
        Journey
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <a href="/dashboard.html" class="nav-item">Dashboard</a>
        <a href="/journals.html" class="nav-item">My Journals</a>
        <a href="/calendar.html" class="nav-item">Calendar View</a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"></div>
        <div class="user-details">
          <h4></h4>
          <p></p>
        </div>
      </div>
      <div class="sidebar-footer-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">Dark</button>
        <button class="signout-btn">Sign Out</button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <h1 class="header-title">Edit Entry</h1>
      </div>
      <div class="header-right">
        <button id="backBtn" class="btn btn--ghost">Back</button>
      </div>
    </header>

    <div class="content">
      <!-- Entry Header -->
      <section class="card entry-header">
        <div class="entry-meta-info">
          <div class="entry-date-badge">
            <span id="entryDateDisplay"></span>
          </div>
          <div class="entry-actions">
            <button id="saveBtn" class="btn btn--primary">Save Changes</button>
            <button id="deleteBtn" class="btn btn--danger">Delete Entry</button>
          </div>
        </div>
      </section>

      <!-- Entry Form -->
      <section class="card entry-form">
        <div class="form-row">
          <div class="form-group">
            <label for="title" class="label">Title</label>
            <input id="title" type="text" placeholder="Enter entry title..." class="form-input" />
          </div>
          <div class="form-group">
            <label for="entryDate" class="label">Date</label>
            <input id="entryDate" type="date" class="form-input" />
          </div>
        </div>

        <div class="form-group">
          <label for="content" class="label">Content</label>
          <textarea id="content" placeholder="Write your thoughts and experiences here..." class="form-textarea"></textarea>
        </div>
      </section>

      <!-- Images Section -->
      <section class="card images-section">
        <div class="section-header">
          <h3 class="section-title">
            <span>Images</span>
            <span class="image-count" id="imageCount">0 photos</span>
          </h3>
        </div>

        <!-- Current Images -->
        <div class="current-images">
          <h4 class="subsection-title">Current Images</h4>
          <div id="imageBox" class="image-gallery"></div>
        </div>

        <!-- Add Images -->
        <div class="add-images">
          <h4 class="subsection-title">Add More Images</h4>
          <div class="upload-area">
            <input id="imageInput" type="file" accept="image/*" multiple class="file-input" />
            <label for="imageInput" class="upload-label">
              <div class="upload-text">
                <strong>Choose Images</strong>
                <small>You can select multiple images at once</small>
              </div>
            </label>
          </div>

          <div id="previewBox" class="image-preview"></div>

          <button id="addImagesBtn" class="btn btn--primary add-images-btn">Add Selected Images</button>
        </div>
      </section>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
</body>
</html>
