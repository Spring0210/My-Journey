<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Journal Entry Detail - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/image-utils.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/detail.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="/journals.html" class="sidebar-brand">
        <div class="logo">J</div>
        Journey
      </a>
    </div>
    
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <a href="/dashboard.html" class="nav-item">
          <span class="icon">🏠</span>
          Dashboard
        </a>
        <a href="/journals.html" class="nav-item">
          <span class="icon">📝</span>
          My Journals
        </a>
        <a href="/calendar.html" class="nav-item">
          <span class="icon">📅</span>
          Calendar View
        </a>
      </div>
    </nav>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"></div>
        <div class="user-details">
          <h4></h4>
          <p></p>
        </div>
      </div>
      <button class="signout-btn">Sign Out</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <h1 class="header-title">Edit Entry</h1>
      </div>
      <div class="header-right">
        <button id="backBtn" class="btn btn--ghost">
          <span>←</span>
          Back
        </button>
      </div>
    </header>

    <div class="content">
      <!-- Entry Header -->
      <section class="card entry-header">
        <div class="entry-meta-info">
          <div class="entry-date-badge">
            <span class="date-icon">📅</span>
            <span id="entryDateDisplay"></span>
          </div>
          <div class="entry-actions">
            <button id="saveBtn" class="btn btn--primary">
              <span>💾</span>
              Save Changes
            </button>
            <button id="deleteBtn" class="btn btn--danger">
              <span>🗑️</span>
              Delete Entry
            </button>
          </div>
        </div>
      </section>

      <!-- Entry Form -->
      <section class="card entry-form">
        <div class="form-row">
          <div class="form-group">
            <label for="title" class="label">
              <span class="label-icon">📝</span>
              Title
            </label>
            <input id="title" type="text" placeholder="Enter entry title..." class="form-input" />
          </div>
          <div class="form-group">
            <label for="entryDate" class="label">
              <span class="label-icon">📅</span>
              Date
            </label>
            <input id="entryDate" type="date" class="form-input" />
          </div>
        </div>

        <div class="form-group">
          <label for="content" class="label">
            <span class="label-icon">📄</span>
            Content
          </label>
          <textarea id="content" placeholder="Write your thoughts and experiences here..." class="form-textarea"></textarea>
        </div>
      </section>

      <!-- Images Section -->
      <section class="card images-section">
        <div class="section-header">
          <h3 class="section-title">
            <span>
              <span class="section-icon">📸</span>
              Images
            </span>
            <span class="image-count" id="imageCount">0 photos</span>
          </h3>
        </div>

        <!-- Current Images -->
        <div class="current-images">
          <h4 class="subsection-title">Current Images</h4>
          <div id="imageBox" class="image-gallery">
            <!-- Images will be loaded here -->
          </div>
        </div>

        <!-- Add Images -->
        <div class="add-images">
          <h4 class="subsection-title">Add More Images</h4>
          <div class="upload-area">
            <input id="imageInput" type="file" accept="image/*" multiple class="file-input" />
            <label for="imageInput" class="upload-label">
              <div class="upload-icon">📁</div>
              <div class="upload-text">
                <strong>Choose Images</strong>
                <small>You can select multiple images at once</small>
              </div>
            </label>
          </div>
          
          <div id="previewBox" class="image-preview"></div>
          
          <button id="addImagesBtn" class="btn btn--primary add-images-btn">
            <span>➕</span>
            Add Selected Images
          </button>
        </div>
      </section>
    </div>
  </main>
</div>
</body>
</html>
