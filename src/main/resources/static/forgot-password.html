<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · Journey</title>
  <link rel="stylesheet" href="/css/auth.css" />
  <script defer src="/js/forgot-password.js"></script>
</head>
<body>
<main class="auth-shell">
  <section class="card" aria-label="Reset password form">

    <div class="brand">
      <div class="logo">J</div>
      <h1>Journey</h1>
    </div>

    <!-- Step 1 -->
    <form id="step1Form" class="form" novalidate>
      <p class="form-subtitle">Enter your username and email to receive a reset code.</p>
      <div>
        <label class="label" for="username">Username</label>
        <input class="input" id="username" type="text" placeholder="Your username" required />
      </div>
      <div>
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" placeholder="Your registered email" required />
      </div>
      <div class="error" id="err-step1"></div>
      <button class="btn" type="submit">Send Code</button>
    </form>

    <!-- Step 2 (hidden until code is sent) -->
    <form id="step2Form" class="form" novalidate hidden>
      <p class="form-subtitle" id="codeSentMsg"></p>

      <div>
        <label class="label" for="code">Verification Code</label>
        <div class="code-row">
          <input class="input" id="code" type="text" placeholder="6-digit code" maxlength="6" inputmode="numeric" required />
          <button class="btn-resend" type="button" id="resendBtn">Resend</button>
        </div>
      </div>

      <div>
        <label class="label" for="newPassword">New Password</label>
        <input class="input" id="newPassword" type="password" placeholder="New password" required />
      </div>
      <div>
        <label class="label" for="confirmNewPassword">Confirm Password</label>
        <input class="input" id="confirmNewPassword" type="password" placeholder="Confirm new password" required />
      </div>
      <div class="error" id="err-step2"></div>
      <button class="btn" type="submit">Reset Password</button>
    </form>

    <div class="hr"></div>
    <p class="footer"><a class="link" href="/login.html">Back to login</a></p>

  </section>
</main>
</body>
</html>
