<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password · Journey</title>
  <link rel="stylesheet" href="/css/auth.css" />
  <script defer src="/js/forgot-password.js"></script>
</head>
<body>
<main class="auth-shell">
  <section class="card" aria-label="Reset password form">

    <div class="brand">
      <div class="logo">J</div>
      <h1>Journey</h1>
    </div>

    <h2 class="form-title">Reset your password</h2>

    <!-- Step 1: Enter username + email -->
    <form id="step1Form" class="form" novalidate>
      <div>
        <label class="label" for="username">Username</label>
        <input class="input" id="username" name="username" type="text" placeholder="Your username" required />
      </div>
      <div>
        <label class="label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" placeholder="Your registered email" required />
      </div>
      <div class="error" id="err-step1"></div>
      <button class="btn" type="submit">Send Verification Code</button>
    </form>

    <!-- Step 2: Enter code + new password -->
    <form id="step2Form" class="form" novalidate>
      <div class="notice">
        A 6-digit code has been sent to your email. It expires in 10 minutes.
      </div>
      <div>
        <label class="label" for="code">Verification Code</label>
        <input class="input" id="code" name="code" type="text" placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric" required />
      </div>
      <div>
        <label class="label" for="newPassword">New Password</label>
        <input class="input" id="newPassword" name="newPassword" type="password" placeholder="New password" required />
      </div>
      <div>
        <label class="label" for="confirmNewPassword">Confirm Password</label>
        <input class="input" id="confirmNewPassword" name="confirmNewPassword" type="password" placeholder="Confirm new password" required />
      </div>
      <div class="error" id="err-step2"></div>
      <button class="btn" type="submit">Reset Password</button>
      <button class="btn btn-ghost resend-btn" type="button" id="backBtn">Resend Code</button>
    </form>

    <div class="hr"></div>
    <p class="footer"><a class="link" href="/login.html">Back to login</a></p>

  </section>
</main>
</body>
</html>
