<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Reset password · Journey</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <script defer src="/js/forgot-password.js"></script>
</head>

<body>
<main class="auth-shell">
    <section class="card" aria-label="Reset password form">
        <div class="brand">
            <div class="logo">J</div>
            <h1>Journey</h1>
        </div>

        <h2 style="margin:4px 0 16px 0">Reset your password</h2>

        <!-- Step 1: Enter username + email -->
        <form id="step1Form" class="form" novalidate>
            <div>
                <label class="label" for="username">Username</label>
                <input class="input" id="username" name="username" type="text" placeholder="Your username" required />
            </div>
            <div>
                <label class="label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email" placeholder="Your registered email" required />
            </div>
            <div class="error" id="err-step1" hidden></div>
            <button class="btn" type="submit">Send verification code</button>
        </form>

        <!-- Step 2: Enter code + new password (hidden initially) -->
        <form id="step2Form" class="form" novalidate hidden>
            <p style="font-size:0.875rem;color:var(--text-muted);margin:0 0 12px 0">
                A 6-digit code has been sent to your email. It expires in 10 minutes.
            </p>
            <div>
                <label class="label" for="code">Verification code</label>
                <input class="input" id="code" name="code" type="text" placeholder="6-digit code" maxlength="6" required />
            </div>
            <div class="row">
                <div>
                    <label class="label" for="newPassword">New password</label>
                    <input class="input" id="newPassword" name="newPassword" type="password" placeholder="New password" required />
                </div>
                <div>
                    <label class="label" for="confirmNewPassword">Confirm</label>
                    <input class="input" id="confirmNewPassword" name="confirmNewPassword" type="password" placeholder="Confirm" required />
                </div>
            </div>
            <div class="error" id="err-step2" hidden></div>
            <button class="btn" type="submit">Reset password</button>
            <button class="btn-ghost" type="button" id="backBtn">Resend code</button>
        </form>

        <div class="hr"></div>
        <a class="btn-ghost" href="/login.html">Back to login</a>
    </section>
</main>
</body>
</html>
