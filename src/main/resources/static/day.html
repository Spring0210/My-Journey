<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Entries of the Day - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/day.css" />
  <script defer src="/js/api.js"></script>
  <script defer src="/js/image-utils.js"></script>
  <script defer src="/js/layout.js"></script>
  <script defer src="/js/day.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="/journals.html" class="sidebar-brand">
        <div class="logo">J</div>
        Journey
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <a href="/dashboard.html" class="nav-item">Dashboard</a>
        <a href="/journals.html" class="nav-item">My Journals</a>
        <a href="/calendar.html" class="nav-item">Calendar View</a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"></div>
        <div class="user-details">
          <h4></h4>
          <p></p>
        </div>
      </div>
      <div class="sidebar-footer-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">Dark</button>
        <button class="signout-btn">Sign Out</button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <h1 class="header-title">Entries on <span id="dayText"></span></h1>
      </div>
      <div class="header-right">
        <a href="/calendar.html" class="btn btn--ghost">Back to Calendar</a>
      </div>
    </header>

    <div class="content">
      <div id="list"></div>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
</body>
</html>
