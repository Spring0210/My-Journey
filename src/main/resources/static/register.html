<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up · Journey</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <script defer src="/js/register.js"></script>
</head>
<body>
<main class="auth-shell">
    <section class="card" aria-label="Register form">
        <div class="brand">
            <div class="logo">J</div>
            <h1>Journey</h1>
        </div>

        <h2 style="margin:4px 0 16px 0">Create your account</h2>

        <form id="registerForm" class="form" novalidate>
            <!-- Username -->
            <div>
                <label class="label" for="username">Username</label>
                <input class="input" id="username" name="username" type="text" placeholder="Unique username" required />
                <div class="error" id="err-username" hidden></div>
            </div>

            <!-- Email -->
            <div>
                <label class="label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email" placeholder="Your email address" required />
                <div class="error" id="err-email" hidden></div>
            </div>

            <!-- Password & Confirm -->
            <div class="row">
                <div>
                    <label class="label" for="password">Password</label>
                    <input class="input" id="password" name="password" type="password" placeholder="At least 8 characters" required />
                </div>
                <div>
                    <label class="label" for="confirmPassword">Confirm</label>
                    <input class="input" id="confirmPassword" name="confirmPassword" type="password" placeholder="Retype password" required />
                </div>
            </div>
            <div class="error" id="err-password" hidden></div>

            <button class="btn" type="submit">Create account</button>
        </form>

        <!-- OAuth2 divider -->
        <div class="oauth-divider"><span>or</span></div>

        <a class="btn btn-google" href="/oauth2/authorization/google">
            <!-- Google "G" SVG -->
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/>
                <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z"/>
            </svg>
            Continue with Google
        </a>

        <div class="hr"></div>
        <div class="helper">
            <span>Already have an account?</span>
            <a class="link" href="/login.html">Sign in</a>
        </div>

        <p class="footer">By signing up you agree to our terms.</p>
    </section>
</main>
</body>
</html>
