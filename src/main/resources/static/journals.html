<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Journals - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/journals.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/image-utils.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/journals.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="/journals.html" class="sidebar-brand">
        <div class="logo">J</div>
        Journey
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <a href="/dashboard.html" class="nav-item">Dashboard</a>
        <a href="/journals.html" class="nav-item">My Journals</a>
        <a href="/calendar.html" class="nav-item">Calendar View</a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar"></div>
        <div class="user-details">
          <h4></h4>
          <p></p>
        </div>
      </div>
      <div class="sidebar-footer-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">Dark</button>
        <button class="signout-btn">Sign Out</button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <h1 class="header-title">My Journals</h1>
      </div>
      <div class="header-right">
        <a href="/detail.html" class="btn btn--primary">New Entry</a>
      </div>
    </header>

    <div class="content">
      <!-- Search form -->
      <section class="card card--soft">
        <div id="searchForm" class="searchbar">
          <input type="text" id="searchKeyword" placeholder="Search keyword" />
          <input type="date" id="searchDate" />
          <button id="searchBtn" class="btn btn--primary">Search</button>
          <button id="clearBtn" class="btn btn--ghost">Clear</button>
        </div>
      </section>

      <!-- Journal List -->
      <section id="journalList" class="cards"></section>

      <!-- Pagination -->
      <div id="pagination" class="pagination" hidden>
        <button id="prevBtn" class="btn btn--ghost" disabled>← Prev</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="btn btn--ghost">Next →</button>
      </div>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
</body>
</html>
