<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Journals - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/journals.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/image-utils.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/journals.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <h1 class="header-title">My Journals</h1>
      </div>
      <div class="header-right">
        <button class="btn btn--ghost" id="writingPromptsBtn">Writing Prompts</button>
        <button class="btn btn--ghost" id="monthlyRecapBtn">Monthly Recap</button>
        <a href="/detail.html" class="btn btn--primary">New Entry</a>
      </div>
    </header>

    <div class="content">
      <!-- Search form -->
      <section class="card card--soft">
        <div id="searchForm" class="searchbar">
          <input type="text" id="searchKeyword" placeholder="Search keyword" />
          <input type="date" id="searchDate" />
          <button id="searchBtn" class="btn btn--primary">Search</button>
          <button id="clearBtn" class="btn btn--ghost">Clear</button>
        </div>
        <div class="searchbar-divider"></div>
        <div class="searchbar searchbar--ai">
          <input type="text" id="aiSearchInput" placeholder="Ask anything, e.g. entries about my trip to Tokyo" />
          <button id="aiSearchBtn" class="btn btn--primary">AI Search</button>
        </div>
        <div id="aiSearchMeta" class="ai-search-meta" hidden></div>
      </section>

      <!-- Journal List -->
      <section id="journalList" class="cards"></section>

      <!-- Pagination -->
      <div id="pagination" class="pagination" hidden>
        <button id="prevBtn" class="btn btn--ghost" disabled>← Prev</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="btn btn--ghost">Next →</button>
      </div>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Writing Prompts Modal -->
<div class="modal-overlay" id="promptsModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3>Writing Prompts</h3>
      <button class="modal-close" id="closePromptsModal">&times;</button>
    </div>
    <div class="modal-body">
      <p class="prompts-intro" id="promptsIntro">Personalized prompts based on your recent entries.</p>
      <div id="promptsList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--ghost btn--sm" id="refreshPromptsBtn">Refresh</button>
      <button class="btn btn--ghost" id="closePromptsBtn">Close</button>
    </div>
  </div>
</div>

<!-- Monthly Recap Modal -->
<div class="modal-overlay" id="recapModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3>Monthly Recap</h3>
      <button class="modal-close" id="closeRecapModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="recap-picker">
        <select id="recapYear"></select>
        <select id="recapMonth">
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
        <button class="btn btn--primary btn--sm" id="generateRecapBtn">Generate</button>
      </div>
      <p id="recapText" class="recap-text" hidden></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn--ghost" id="closeRecapBtn">Close</button>
    </div>
  </div>
</div>
</body>
</html>
