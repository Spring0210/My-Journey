<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/dashboard.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <h1 class="header-title">Dashboard</h1>
      </div>
      <div class="header-right">
        <a href="/detail.html" class="btn btn--primary">New Entry</a>
      </div>
    </header>

    <div class="content">
      <!-- Stats Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-content">
            <h3 id="totalEntries">0</h3>
            <p>Total Entries</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-content">
            <h3 id="thisMonthEntries">0</h3>
            <p>This Month</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-content">
            <h3 id="totalImages">0</h3>
            <p>Total Images</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-content">
            <h3 id="streakDays">0</h3>
            <p>Day Streak</p>
          </div>
        </div>
      </div>

      <!-- Recent Entries -->
      <section class="card">
        <h2 class="card__title">Recent Entries</h2>
        <div id="recentEntries" class="recent-entries">
          <div class="loading">Loading recent entries...</div>
        </div>
        <div class="text-center mt-2">
          <a href="/journals.html" class="btn btn--ghost">View All Entries</a>
        </div>
      </section>

      <!-- Quick Actions -->
      <section class="card">
        <h2 class="card__title">Quick Actions</h2>
        <div class="quick-actions">
          <a href="/detail.html" class="quick-action">
            <div class="quick-action-content">
              <h4>Write New Entry</h4>
              <p>Start documenting your thoughts and experiences</p>
            </div>
          </a>
          <a href="/calendar.html" class="quick-action">
            <div class="quick-action-content">
              <h4>View Calendar</h4>
              <p>Browse your entries by date</p>
            </div>
          </a>
        </div>
      </section>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
</body>
</html>
