<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Image Upload</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .result { margin-top: 10px; padding: 10px; background-color: #f5f5f5; border-radius: 3px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        input[type="file"] { margin: 10px 0; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 Cloudinary 图片上传测试</h1>
    
    <div class="test-section">
        <h3>📤 测试图片上传到 Cloudinary</h3>
        <p>选择一个图片文件进行上传测试：</p>
        
        <input type="file" id="imageInput" accept="image/*" multiple>
        <br>
        <button onclick="testUpload()">🚀 开始上传测试</button>
        
        <div id="uploadResult" class="result" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h3>📋 测试说明</h3>
        <ul>
            <li>选择图片文件后点击"开始上传测试"</li>
            <li>系统会自动上传到 Cloudinary 云存储</li>
            <li>上传成功后会在 Cloudinary 控制台的 <code>journals/images</code> 文件夹中看到</li>
            <li>返回的 URL 会以 <code>https://res.cloudinary.com/</code> 开头</li>
        </ul>
    </div>

    <script>
        async function testUpload() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('uploadResult');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                showResult('请先选择图片文件！', 'error');
                return;
            }

            showResult('🔄 正在上传图片到 Cloudinary...', 'info');

            try {
                const formData = new FormData();
                for (let file of fileInput.files) {
                    formData.append('images', file);
                }
                formData.append('title', 'Cloudinary 测试日记');
                formData.append('content', '这是一个测试日记条目，用于验证 Cloudinary 图片上传功能。');
                formData.append('date', new Date().toISOString().split('T')[0]);

                const response = await fetch('/api/journal/entries', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    showResult(`✅ 上传成功！<br>
                        <strong>日记 ID:</strong> ${result.id}<br>
                        <strong>图片数量:</strong> ${result.imagePathList ? result.imagePathList.length : 0}<br>
                        <strong>图片 URLs:</strong><br>
                        ${result.imagePathList ? result.imagePathList.map(url => `• ${url}`).join('<br>') : '无图片'}
                        <br><br>
                        🎉 请检查 Cloudinary 控制台中的 <code>journals/images</code> 文件夹！`, 'success');
                } else {
                    const error = await response.text();
                    showResult(`❌ 上传失败！<br><strong>错误:</strong> ${error}`, 'error');
                }
            } catch (error) {
                showResult(`❌ 网络错误！<br><strong>错误:</strong> ${error.message}`, 'error');
            }
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.innerHTML = message;
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
