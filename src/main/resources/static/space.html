<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/spaces.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/image-utils.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/space.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <a href="/spaces.html" class="btn btn--ghost btn--sm">← Back</a>
        <h1 class="header-title" id="spaceTitle">Loading...</h1>
      </div>
      <div class="header-right" id="spaceActions"></div>
    </header>

    <div class="content space-layout">
      <!-- Left: Timeline -->
      <div class="timeline-column">
        <!-- Post Composer -->
        <div class="card composer" id="composer">
          <textarea id="postContent" placeholder="Share something with the space..." rows="3"></textarea>
          <div class="composer-footer">
            <label class="upload-label">
              <input type="file" id="postImages" multiple accept="image/*" hidden />
              📷 Add Photos
            </label>
            <label class="upload-label">
              <input type="file" id="postVideos" accept="video/*" hidden />
              🎥 Add Video
            </label>
            <div id="imagePreviewList" class="composer-previews"></div>
            <button class="btn btn--primary" id="postBtn">Post</button>
          </div>
          <div id="uploadProgress" class="upload-progress" hidden>
            <div class="upload-progress-bar">
              <div class="upload-progress-fill" id="uploadProgressFill"></div>
            </div>
            <span class="upload-progress-text" id="uploadProgressText">Uploading 0%</span>
          </div>
        </div>

        <!-- Posts Timeline -->
        <div id="postsList">
          <div class="loading">Loading posts...</div>
        </div>

        <!-- Pagination -->
        <div id="postsPagination" class="pagination" hidden>
          <button id="prevPostsBtn" class="btn btn--ghost" disabled>← Prev</button>
          <span id="postsPageInfo"></span>
          <button id="nextPostsBtn" class="btn btn--ghost">Next →</button>
        </div>
      </div>

      <!-- Right: Space Info -->
      <aside class="space-info-column">
        <div class="card">
          <!-- Cover image banner (hidden until a cover is set) -->
          <div class="space-cover-wrap" id="spaceCoverWrap" hidden>
            <img class="space-cover-img" id="spaceCoverImg" src="" alt="Space cover" />
          </div>
          <div class="space-info-header">
            <h4 class="card__title">Space Info</h4>
            <div id="spaceInfoActions"></div>
          </div>
          <p id="spaceDescription" class="muted"></p>
          <div class="invite-code-box" id="inviteCodeBox" hidden>
            <span class="invite-label">Invite Code</span>
            <span class="invite-code" id="inviteCode"></span>
            <button class="btn btn--ghost btn--sm" id="copyCodeBtn">Copy</button>
          </div>
        </div>

        <div class="card">
          <h4 class="card__title">Members <span id="memberCount" class="muted"></span></h4>
          <div id="membersList"></div>
        </div>

        <div id="dangerZone" class="card danger-card" hidden>
          <h4 class="card__title">Actions</h4>
          <button class="btn btn--danger btn--sm" id="leaveOrDeleteBtn"></button>
        </div>
      </aside>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Edit Space Modal -->
<div class="modal-overlay" id="editSpaceModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Space</h3>
      <button class="modal-close" id="closeEditModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Space Name <span class="required">*</span></label>
        <input type="text" id="editSpaceName" maxlength="100" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="editSpaceDesc" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Cover Image</label>
        <div class="cover-upload-wrap">
          <img class="cover-preview" id="coverPreview" src="" alt="Cover preview" hidden />
          <label class="btn btn--ghost btn--sm cover-upload-label">
            Choose Image
            <input type="file" id="coverFileInput" accept="image/*" hidden />
          </label>
          <span class="cover-filename" id="coverFilename"></span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--ghost" id="cancelEdit">Cancel</button>
      <button class="btn btn--primary" id="confirmEdit">Save</button>
    </div>
  </div>
</div>

<!-- Image Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</button>
  <img class="lightbox-img" id="lightboxImg" />
  <button class="lightbox-nav lightbox-next" id="lightboxNext">&#8250;</button>
</div>
</body>
</html>
