<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spaces - Journey</title>
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/spaces.css" />
  <script defer src="js/api.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/spaces.js"></script>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="sidebar-toggle">☰</button>
        <h1 class="header-title">My Spaces</h1>
      </div>
      <div class="header-right">
        <button class="btn btn--ghost" id="joinBtn">Join Space</button>
        <button class="btn btn--primary" id="createBtn">+ New Space</button>
      </div>
    </header>

    <div class="content">
      <!-- Spaces Grid -->
      <div id="spacesList" class="spaces-grid">
        <div class="loading">Loading spaces...</div>
      </div>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Create Space Modal -->
<div class="modal-overlay" id="createModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3>Create New Space</h3>
      <button class="modal-close" id="closeCreateModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Space Name <span class="required">*</span></label>
        <input type="text" id="spaceName" placeholder="e.g. Europe Trip 2026" maxlength="100" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="spaceDesc" placeholder="What is this space for?" rows="3"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--ghost" id="cancelCreate">Cancel</button>
      <button class="btn btn--primary" id="confirmCreate">Create</button>
    </div>
  </div>
</div>

<!-- Join Space Modal -->
<div class="modal-overlay" id="joinModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3>Join a Space</h3>
      <button class="modal-close" id="closeJoinModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Invite Code <span class="required">*</span></label>
        <input type="text" id="inviteCodeInput" placeholder="e.g. A3KX9QMP" maxlength="20" style="text-transform:uppercase;" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--ghost" id="cancelJoin">Cancel</button>
      <button class="btn btn--primary" id="confirmJoin">Join</button>
    </div>
  </div>
</div>
</body>
</html>
